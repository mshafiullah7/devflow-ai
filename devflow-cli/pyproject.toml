[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "devflow-agent"
version = "0.1.0"
requires-python = ">=3.10"
description = "Devflow AI coding agent — multi-provider autonomous loop"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "ollama>=0.4.0",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
# pip install -e ".[rag]" to enable semantic code search
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "gitpython>=3.1.0",
]

[project.scripts]
devflow = "agent:main"

[tool.setuptools]
# Flat .py files at package root
py-modules = [
    "agent",
    "context_builder",
    "devflow_agent",
    "rag",
    "ollama_proxy",
    "openai_proxy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["providers*", "tools*"]
