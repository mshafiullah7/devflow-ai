<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background: deep navy with subtle gradient -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1f35"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7f7"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg1)"/>

  <!-- Terminal prompt ">_" centered, bold -->
  <text x="256" y="230" font-family="'Courier New', monospace" font-size="160" font-weight="700"
        fill="url(#accent1)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow1)">
    &gt;_
  </text>

  <!-- Flow arrow beneath — representing the pipeline -->
  <path d="M 110 310 L 340 310" stroke="#6ee7f7" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M 310 280 L 360 310 L 310 340" fill="none" stroke="#6ee7f7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- AI sparkle top-right corner of the prompt area -->
  <g transform="translate(360, 145)" filter="url(#glow1)">
    <!-- 4-point star -->
    <path d="M0,-18 L4,-4 L18,0 L4,4 L0,18 L-4,4 L-18,0 L-4,-4 Z" fill="#f9a8d4" opacity="0.95"/>
  </g>

  <!-- Small dots below arrow — progress indicators -->
  <circle cx="175" cy="368" r="10" fill="#6ee7f7" opacity="0.9"/>
  <circle cx="220" cy="368" r="10" fill="#a78bfa" opacity="0.9"/>
  <circle cx="265" cy="368" r="10" fill="#6ee7f7" opacity="0.5"/>
  <circle cx="310" cy="368" r="10" fill="#6ee7f7" opacity="0.2"/>
</svg>
