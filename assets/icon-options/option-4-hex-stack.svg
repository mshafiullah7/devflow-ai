<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer hex ring (wireframe) r=205, covers ~80% height -->
  <polygon
    points="256,51 433.5,153.5 433.5,358.5 256,461 78.5,358.5 78.5,153.5"
    fill="none" stroke="#7c3aed" stroke-width="6" opacity="0.4"/>

  <!-- Middle hex r=146 -->
  <polygon
    points="256,110 382.4,183 382.4,329 256,402 129.6,329 129.6,183"
    fill="none" stroke="#8b5cf6" stroke-width="8" opacity="0.55"/>

  <!-- Inner hex (filled, solid) r=89 -->
  <polygon
    points="256,167 333,211.5 333,300.5 256,345 179,300.5 179,211.5"
    fill="#4c1d95" stroke="#a78bfa" stroke-width="6" opacity="0.9" filter="url(#glow4)"/>

  <!-- AI sparkle / star in center (scaled up) -->
  <g transform="translate(256,256)" filter="url(#glow4)">
    <!-- Large 4-point star -->
    <path d="M0,-45 L9,-9 L45,0 L9,9 L0,45 L-9,9 L-45,0 L-9,-9 Z"
          fill="#e9d5ff" opacity="0.95"/>
    <!-- Small center dot -->
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>
  </g>

  <!-- Three small dots on right edge of middle hex — pipeline stages -->
  <circle cx="404" cy="216" r="10" fill="#a78bfa" opacity="0.9"/>
  <circle cx="404" cy="256" r="10" fill="#c4b5fd" opacity="0.9"/>
  <circle cx="404" cy="296" r="10" fill="#a78bfa" opacity="0.9"/>

  <!-- "DF" monogram faint in background -->
  <text x="256" y="270" font-family="Arial Black, Arial, sans-serif" font-size="84" font-weight="900"
        fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" opacity="0.18"
        letter-spacing="-4">DF</text>
</svg>
