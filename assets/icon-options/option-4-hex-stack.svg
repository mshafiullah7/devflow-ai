<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12002a"/>
      <stop offset="100%" style="stop-color:#1e0640"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Hexagon at center -->
    <!-- Pointy-top hex: 6 vertices for r=90 centered at 256,256 -->
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg4)"/>

  <!-- Outer hex ring (wireframe) -->
  <!-- r=175 pointy-top hex centered 256,256 -->
  <polygon
    points="256,81 408,168.5 408,343.5 256,431 104,343.5 104,168.5"
    fill="none" stroke="#7c3aed" stroke-width="6" opacity="0.4"/>

  <!-- Middle hex -->
  <polygon
    points="256,131 368,195.5 368,316.5 256,381 144,316.5 144,195.5"
    fill="none" stroke="#8b5cf6" stroke-width="8" opacity="0.55"/>

  <!-- Inner hex (filled, solid) -->
  <polygon
    points="256,180 330,222.5 330,289.5 256,332 182,289.5 182,222.5"
    fill="#4c1d95" stroke="#a78bfa" stroke-width="6" opacity="0.9" filter="url(#glow4)"/>

  <!-- AI sparkle / star in center -->
  <g transform="translate(256,256)" filter="url(#glow4)">
    <!-- Large 4-point star -->
    <path d="M0,-38 L8,-8 L38,0 L8,8 L0,38 L-8,8 L-38,0 L-8,-8 Z"
          fill="#e9d5ff" opacity="0.95"/>
    <!-- Small center dot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- Three small dots on right edge of middle hex — pipeline stages -->
  <circle cx="390" cy="220" r="9" fill="#a78bfa" opacity="0.9"/>
  <circle cx="390" cy="256" r="9" fill="#c4b5fd" opacity="0.9"/>
  <circle cx="390" cy="292" r="9" fill="#a78bfa" opacity="0.9"/>

  <!-- "DF" monogram faint in background -->
  <text x="256" y="270" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900"
        fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" opacity="0.18"
        letter-spacing="-4">DF</text>
</svg>
